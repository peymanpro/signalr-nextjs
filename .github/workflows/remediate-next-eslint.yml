name: One-time Next lint-toolchain remediation

on:
  push:
    branches:
      - 'remediate/next-eslint-no-braces-20261010'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: remediate/next-eslint-no-braces-20261010
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Replace Next-specific ESLint dependency tree
        run: |
          npm uninstall eslint-config-next --save-dev --no-fund
          npm install --save-dev @eslint/js@^9 globals@latest eslint-plugin-jsx-a11y@latest eslint-plugin-react@latest eslint-plugin-react-hooks@latest --no-fund

      - name: Apply compatible transitive audit fixes
        run: npm audit fix --no-fund || echo "Any residual audit item will be reviewed explicitly."

      - name: Verify reproducible installation
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Syntax and type-oriented checks
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Report exact dependency audit result
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
          console.log("NPM_AUDIT_SUMMARY=" + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log("NPM_AUDIT_PACKAGE=" + JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable }));
          }
          NODE

      - name: Commit verified lockfile and remove temporary workflow
        env:
          BRANCH_NAME: remediate/next-eslint-no-braces-20261010
        run: |
          rm -f .github/workflows/remediate-next-eslint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "security: remove vulnerable Next lint dependency chain"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
